before_script:
  - git lfs pull


default:
  tags:
    - pixi


stages:
  - test
  - deploy


test_arosics:
  stage: test
  coverage: '/TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  script:
    - pixi install -e dev
    - pixi run create-env-info dev
    - pixi run -e dev pytest
    - pixi run -e dev docs
  artifacts:
    expose_as: 'Test and coverage report'
    paths:
    - htmlcov/
    - report.html
    - docs/_build/html/
    - env_info__dev/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
      junit: report.xml

    expire_in: 30 days
    when: always


test_styles:
  stage: test
  script:
    - pixi install -e lint
    - pixi run -e lint lint


test_urls:
  stage: test
  script:
    - pixi install -e urlcheck
    - pixi run -e urlcheck urlcheck
  when: always


test_arosics_install:
  stage: test
  script:
    # create a fresh pixi environment from pyproject.toml and install the package
    - pixi install

    # check if the dependencies are installed correctly
    - pixi run pip check || true

    # install arosics itself
    - pixi run pip install . --no-deps

    # import test
    - cd /tmp  # somewhere outside the project directory
    - |
      pixi run -m "$CI_PROJECT_DIR/pyproject.toml" python -c "
      import arosics; print(arosics)
      from arosics import COREG, COREG_LOCAL
      "
  only:
    - main


pages:  # this job must be called 'pages' to advise GitLab to upload content to GitLab Pages
  stage: deploy
  dependencies:
    - test_arosics
  script:
    # Create the public directory
    - rm -rf public
    - mkdir public
    - mkdir -p public/doc
    - mkdir -p public/images/
    - mkdir -p public/coverage
    - mkdir -p public/test_reports

    # Copy over the docs
    - cp -r docs/_build/html/* public/doc/
    - cp -r docs/images/* public/images/

    # Copy over the coverage reports
    - cp -r htmlcov/* public/coverage/

    # Copy over the test reports
    - cp report.html public/test_reports/

    # Check if everything is working great
    - ls -al public
    - ls -al public/doc
    - ls -al public/coverage
    - ls -al public/test_reports
  artifacts:
    paths:
      - public
    expire_in: 10 days
  only:
    - main


deploy_pypi:
  stage: deploy
  dependencies:
    - test_arosics
  script:
    - pixi install -e deploy
    - pixi run -e deploy python -m build --sdist
    - pixi run -e deploy twine check dist/*
    - pixi run -e deploy twine upload dist/*  # requires creds as environment variables
  only:
    - /^v\d+\.\d+\.\d+([abc]\d*)?$/  # PEP-440 compliant version (tags)
  except:
    - dev


create_github_release:
    stage: deploy
    dependencies:
        - test_arosics
    script:
        - bash ./.github/create_release_from_gitlab_ci.sh  # uses environment variables set in the UI
    only:
        - /^v\d+\.\d+\.\d+([abc]\d*)?$/  # PEP-440 compliant version (tags)
    except:
        - dev


#rever:
#    stage: deploy
#    dependencies:
#        - deploy_pypi
#    script:


gitleaks: # Gitleaks security scanner
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  stage: test
  before_script: []  # prevents git lfs pull
  script:
    - gitleaks git --platform gitlab --max-decode-depth 5 --verbose --redact $CI_PROJECT_DIR
